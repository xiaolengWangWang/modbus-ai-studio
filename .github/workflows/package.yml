name: package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check the release version
        shell: bash
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          grep -F "var version = \"$VERSION\"" cmd/modbus-ai/main.go
      - name: Install the Windows cross compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64-win32 zip
      - name: Package Windows x64
        if: runner.os == 'Linux'
        run: sh build/windows.sh
      - name: Package Linux Web x64 and ARM64
        if: runner.os == 'Linux'
        run: sh build/linux-web.sh
      - name: Package modbus-cli for Windows, macOS and Linux
        if: runner.os == 'Linux'
        run: sh build/cli.sh
      - name: Package macOS Intel and Apple Silicon
        if: runner.os == 'macOS'
        run: sh build/macos.sh
      - name: Upload installers for release verification
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            dist/ModbusAIStudio-*-Windows-x64.zip
            dist/ModbusAIStudio-*-macOS-Intel.dmg
            dist/ModbusAIStudio-*-macOS-AppleSilicon.dmg
            dist/ModbusAIStudio-Web-*-Linux-*.tar.gz
            dist/modbus-cli-*.zip
            dist/modbus-cli-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  # 每个包都在对应的系统和 CPU 上运行一次（build/smoke.sh），全部通过 package 才算成功，发版才会继续。
  smoke:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows x64 }
          - { os: macos-15-intel, name: macOS Intel }
          - { os: macos-latest, name: macOS Apple Silicon }
          - { os: ubuntu-latest, name: Linux x64 }
          - { os: ubuntu-24.04-arm, name: Linux ARM64 }
    name: smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true
      - name: Run the packages built for this platform
        shell: bash
        run: sh build/smoke.sh
