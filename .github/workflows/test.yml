name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Linux 下 Fyne 需要的 OpenGL / X11 / Wayland 头文件
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
      - run: go vet ./...
      - name: 测试（界面测试用 Fyne 的软件渲染驱动，不需要显卡）
        if: runner.os != 'Windows'
        run: go test -race -count=1 -timeout 15m ./...
      - name: 测试（Windows），界面截图存下来检查中文字体和布局
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\snapshots" | Out-Null
          $env:MODBUS_AI_SNAPSHOT = "$env:RUNNER_TEMP\snapshots"
          go test -count=1 -timeout 15m ./...
      - name: 上传 Windows 界面截图
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-snapshots
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: ignore
