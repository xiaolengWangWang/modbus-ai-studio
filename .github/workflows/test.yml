name: test

on:
  # 只测分支：发版推 tag 时，tag 指向的提交已经在 main 上测过。
  push:
    branches: ['**']
  pull_request:

jobs:
  # 发布的每种架构都在对应的机器上测：桌面版 Windows x64、macOS Intel / Apple Silicon（Linux 桌面版不发布，
  # 但 Linux x64 上照样全测）；Web 版和 modbus-cli 不用 cgo，在 Linux x64 / ARM64 上按发布时的编法测它们用到的全部包。
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows x64 }
          - { os: macos-15-intel, name: macOS Intel }
          - { os: macos-latest, name: macOS Apple Silicon }
          - { os: ubuntu-latest, name: Linux x64 }
          - { os: ubuntu-24.04-arm, name: Linux ARM64（Web 版、modbus-cli）, nocgo-only: true }
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Linux 下 Fyne 需要的 OpenGL / X11 / Wayland 头文件
        if: runner.os == 'Linux' && !matrix.nocgo-only
        # 软件渲染也需要中文字体，避免缺字时反复查找字体拖慢 race 测试。
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev fonts-noto-cjk
      - run: go vet ./...
        if: '!matrix.nocgo-only'
      - name: 不用 cgo 测 Web 版和 modbus-cli 用到的全部包（发布时就这样编，SQLite 用纯 Go 驱动）
        if: runner.os == 'Linux'
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          pkgs=$(go list -deps ./cmd/modbus-web ./cmd/modbus-cli | grep '^modbus-ai-studio/')
          go vet $pkgs
          go test -count=1 $pkgs
      - name: 测试（界面测试用 Fyne 的软件渲染驱动，不需要显卡）
        if: runner.os != 'Windows' && !matrix.nocgo-only
        shell: bash
        run: |
          # macOS 的界面截图存下来，查浅色主题输入框在软件渲染下没画出字的问题（connection_visibility_test.go）
          if [ "$RUNNER_OS" = macOS ]; then
            mkdir -p "$RUNNER_TEMP/snapshots"
            export MODBUS_AI_SNAPSHOT="$RUNNER_TEMP/snapshots"
          fi
          go test -race -count=1 -timeout 15m ./...
      - name: 上传 macOS 界面截图
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-snapshots-${{ runner.arch }}
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: ignore
      - name: 测试（Windows），界面截图存下来检查中文字体和布局
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\snapshots" | Out-Null
          $env:MODBUS_AI_SNAPSHOT = "$env:RUNNER_TEMP\snapshots"
          go test -count=1 -timeout 15m ./...
      - name: 上传 Windows 界面截图
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-snapshots
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: ignore
